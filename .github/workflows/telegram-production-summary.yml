name: Telegram production summary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Send Telegram summary
    runs-on: ubuntu-latest
    steps:
      - name: Build production summary
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const escapeHtml = (value) => String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            const truncate = (value, maxLength) => {
              const text = String(value ?? "").trim();
              return text.length > maxLength ? `${text.slice(0, maxLength - 1)}...` : text;
            };
            const appUrl = "https://grapply.me";
            const repoUrl = `https://github.com/${owner}/${repo}`;
            const sectionLimit = 6;
            const filePrefix = (status) => {
              if (status === "added") return "🆕";
              if (status === "removed") return "🧹";
              if (status === "renamed") return "🔁";
              return "🛠";
            };
            const areaForFile = (filename) => {
              if (filename.startsWith(".github/workflows/")) return "Automation";
              if (filename.startsWith("app/api/auth/") || filename.includes("auth")) return "Auth";
              if (filename.startsWith("app/api/")) return "Backend API";
              if (filename.startsWith("app/")) return "App screens";
              if (filename.startsWith("components/admin/")) return "Admin";
              if (filename.startsWith("components/")) return "UI";
              if (filename.startsWith("data/")) return "Product data";
              if (filename.startsWith("lib/")) return "App logic";
              if (filename.startsWith("supabase/")) return "Database";
              if (filename.startsWith("docs/")) return "Docs";
              return "Project";
            };
            const areaEmoji = (area) => ({
              "Automation": "🤖",
              "Auth": "🔐",
              "Backend API": "🧩",
              "App screens": "🖥",
              "Admin": "👥",
              "UI": "✨",
              "Product data": "📊",
              "App logic": "🧠",
              "Database": "🗄",
              "Docs": "📝",
              "Project": "📦",
            }[area] || "📦");
            const describeFile = (file) => {
              const filename = file.filename || file;
              const changes = typeof file.changes === "number" ? `${file.changes} lines` : "changed";
              const area = areaForFile(filename);

              return `${filePrefix(file.status)} ${filename} (${area}, ${changes})`;
            };
            const summarizeAreas = (files) => {
              const counts = new Map();
              for (const file of files || []) {
                const filename = file.filename || file;
                const area = areaForFile(filename);
                counts.set(area, (counts.get(area) || 0) + 1);
              }

              return [...counts.entries()]
                .sort((a, b) => b[1] - a[1])
                .slice(0, sectionLimit)
                .map(([area, count]) => `${areaEmoji(area)} ${area}: ${count} file${count === 1 ? "" : "s"}`);
            };
            const cleanBodyLines = (body) => String(body || "")
              .split("\n")
              .map((line) => line.replace(/^#+\s*/, "").replace(/^[-*]\s*/, "").trim())
              .filter((line) => line && !/^<!--/.test(line))
              .slice(0, 6);
            const humanizeCommit = (message) => {
              const title = String(message || "").split("\n")[0].trim();
              return title ? `• ${truncate(title, 150)}` : null;
            };
            const synthesizeHighlights = ({ prBody, headMessage, commits, files }) => {
              const bodyLines = cleanBodyLines(prBody);
              if (bodyLines.length) return bodyLines.map((line) => `• ${truncate(line, 180)}`);

              const commitLines = (commits || [])
                .map((commit) => humanizeCommit(commit.commit?.message || commit.message))
                .filter(Boolean)
                .slice(0, 5);
              if (commitLines.length) return commitLines;

              const areas = summarizeAreas(files);
              if (areas.length) {
                return areas.map((line) => `• Updated ${line.replace(/^.+? /, "")}.`);
              }

              return [`• ${truncate(headMessage || "Production update shipped.", 180)}`];
            };

            const after = context.payload.after || context.sha;
            const commits = context.payload.commits || [];
            const headCommit = context.payload.head_commit || commits.at(-1);
            const headMessage = headCommit?.message || "";
            const messagePrMatch = headMessage.match(/\(#(\d+)\)|pull request #(\d+)/i);

            let title = "Production updated";
            let summary = commits.length
              ? commits.slice(-8).map((commit) => `• ${truncate(commit.message.split("\n")[0], 110)}`).join("\n")
              : `• ${truncate(headMessage || after, 110)}`;
            let detailsUrl = context.payload.compare || `https://github.com/${owner}/${repo}/commit/${after}`;
            let stats = `${commits.length || 1} commit${commits.length === 1 ? "" : "s"}`;
            let touchedAreas = [];
            let compareFiles = [];
            let compareCommits = [];

            for (const commit of commits) {
              for (const file of commit.added || []) touchedAreas.push(`🆕 ${file}`);
              for (const file of commit.modified || []) touchedAreas.push(`🛠 ${file}`);
              for (const file of commit.removed || []) touchedAreas.push(`🧹 ${file}`);
            }

            if (context.payload.before && after) {
              try {
                const { data: compare } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${context.payload.before}...${after}`,
                  per_page: 100,
                });
                compareFiles = compare.files || [];
                compareCommits = compare.commits || [];
                detailsUrl = compare.html_url || detailsUrl;
                const totalCommits = compare.total_commits || commits.length || 1;
                stats = `${totalCommits} commit${totalCommits === 1 ? "" : "s"} | ${compareFiles.length} files changed`;
                touchedAreas = compareFiles.map(describeFile);
              } catch (error) {
                core.warning(`Could not fetch compare details: ${error.message}`);
              }
            }

            let prNumber = messagePrMatch?.[1] || messagePrMatch?.[2];

            if (!prNumber && after) {
              try {
                const { data: associatedPullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: after,
                });
                prNumber = associatedPullRequests[0]?.number;
              } catch (error) {
                core.warning(`Could not find associated PR: ${error.message}`);
              }
            }

            if (prNumber) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(prNumber),
                });
                const { data: files } = await github.rest.pulls.listFiles({
                  owner,
                  repo,
                  pull_number: Number(prNumber),
                  per_page: 30,
                });

                title = `PR #${pr.number}: ${pr.title}`;
                compareFiles = files;
                summary = synthesizeHighlights({
                  prBody: pr.body,
                  headMessage,
                  commits: compareCommits.length ? compareCommits : commits,
                  files,
                }).join("\n");
                detailsUrl = pr.html_url;
                stats = `${pr.changed_files} files changed | +${pr.additions} | -${pr.deletions}`;
                touchedAreas = files.map(describeFile);
              } catch (error) {
                core.warning(`Could not enrich PR summary: ${error.message}`);
              }
            }

            if (!touchedAreas.length && after) {
              try {
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: after,
                });
                touchedAreas = (commit.files || []).map((file) => `${filePrefix(file.status)} ${file.filename}`);
              } catch (error) {
                core.warning(`Could not fetch commit files: ${error.message}`);
              }
            }

            if (!prNumber) {
              title = "Direct production push";
              summary = synthesizeHighlights({
                prBody: "",
                headMessage,
                commits: compareCommits.length ? compareCommits : commits,
                files: compareFiles,
              }).join("\n");
            }

            const fileLines = [...new Set(touchedAreas)].slice(0, 12);
            const areaLines = summarizeAreas(compareFiles.length ? compareFiles : fileLines);
            const prLine = prNumber
              ? `🔢 PR: <a href="${escapeHtml(`https://github.com/${owner}/${repo}/pull/${prNumber}`)}">#${escapeHtml(prNumber)}</a>`
              : "🔢 PR: direct push";
            const message = [
              "🥋 <b>Grapply production update</b>",
              "━━━━━━━━━━━━━━━━",
              "",
              `🚀 <b>${escapeHtml(title)}</b>`,
              prLine,
              `📦 Repo: <code>${escapeHtml(`${owner}/${repo}`)}</code>`,
              `📊 Stats: ${escapeHtml(stats)}`,
              "",
              "✨ <b>What changed</b>",
              escapeHtml(truncate(summary, 1200)),
              "",
              areaLines.length ? "🧭 <b>Main areas</b>" : "",
              areaLines.length ? escapeHtml(areaLines.join("\n")) : "",
              areaLines.length ? "" : "",
              "🗂 <b>Touched files</b>",
              escapeHtml(fileLines.length ? fileLines.join("\n") : "- No files listed"),
              "",
              "━━━━━━━━━━━━━━━━",
              `🌐 <a href="${escapeHtml(appUrl)}">Open Grapply</a> · 🧑‍💻 <a href="${escapeHtml(repoUrl)}">GitHub</a> · 🔎 <a href="${escapeHtml(detailsUrl)}">View changes</a>`,
            ].join("\n").slice(0, 3900);

            core.setOutput("text", message);

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEXT: ${{ steps.summary.outputs.text }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TELEGRAM_TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
