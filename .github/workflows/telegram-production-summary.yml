name: Telegram production summary

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Send Telegram summary
    runs-on: ubuntu-latest
    steps:
      - name: Build production summary
        id: summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const escapeHtml = (value) => String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            const truncate = (value, maxLength) => {
              const text = String(value ?? "").trim();
              return text.length > maxLength ? `${text.slice(0, maxLength - 1)}...` : text;
            };
            const filePrefix = (status) => {
              if (status === "added") return "+";
              if (status === "removed") return "-";
              if (status === "renamed") return ">";
              return "~";
            };
            const describeFile = (file) => {
              const filename = file.filename || file;
              const changes = typeof file.changes === "number" ? `${file.changes} lines` : "changed";
              let area = "project file";

              if (filename.startsWith(".github/workflows/")) area = "automation/workflow";
              else if (filename.startsWith("app/api/")) area = "backend API route";
              else if (filename.startsWith("app/")) area = "app page/route";
              else if (filename.startsWith("components/")) area = "UI component";
              else if (filename.startsWith("data/")) area = "domain/mock data";
              else if (filename.startsWith("lib/")) area = "shared app logic";
              else if (filename.startsWith("supabase/")) area = "database schema/seed";
              else if (filename.startsWith("docs/")) area = "documentation";

              return `${filePrefix(file.status)} ${filename} (${area}, ${changes})`;
            };

            const after = context.payload.after || context.sha;
            const commits = context.payload.commits || [];
            const headCommit = context.payload.head_commit || commits.at(-1);
            const headMessage = headCommit?.message || "";
            const messagePrMatch = headMessage.match(/\(#(\d+)\)|pull request #(\d+)/i);

            let title = "Production updated";
            let summary = commits.length
              ? commits.slice(-8).map((commit) => `- ${truncate(commit.message.split("\n")[0], 110)}`).join("\n")
              : `- ${truncate(headMessage || after, 110)}`;
            let detailsUrl = context.payload.compare || `https://github.com/${owner}/${repo}/commit/${after}`;
            let stats = `${commits.length || 1} commit${commits.length === 1 ? "" : "s"}`;
            let touchedAreas = [];
            let compareFiles = [];
            let compareCommits = [];

            for (const commit of commits) {
              for (const file of commit.added || []) touchedAreas.push(`+ ${file}`);
              for (const file of commit.modified || []) touchedAreas.push(`~ ${file}`);
              for (const file of commit.removed || []) touchedAreas.push(`- ${file}`);
            }

            if (context.payload.before && after) {
              try {
                const { data: compare } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${context.payload.before}...${after}`,
                  per_page: 100,
                });
                compareFiles = compare.files || [];
                compareCommits = compare.commits || [];
                detailsUrl = compare.html_url || detailsUrl;
                const totalCommits = compare.total_commits || commits.length || 1;
                stats = `${totalCommits} commit${totalCommits === 1 ? "" : "s"} | ${compareFiles.length} files changed`;
                touchedAreas = compareFiles.map(describeFile);
              } catch (error) {
                core.warning(`Could not fetch compare details: ${error.message}`);
              }
            }

            let prNumber = messagePrMatch?.[1] || messagePrMatch?.[2];

            if (!prNumber && after) {
              try {
                const { data: associatedPullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: after,
                });
                prNumber = associatedPullRequests[0]?.number;
              } catch (error) {
                core.warning(`Could not find associated PR: ${error.message}`);
              }
            }

            if (prNumber) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(prNumber),
                });
                const { data: files } = await github.rest.pulls.listFiles({
                  owner,
                  repo,
                  pull_number: Number(prNumber),
                  per_page: 30,
                });

                title = `#${pr.number}: ${pr.title}`;
                summary = pr.body?.trim() || headMessage || "No release notes provided.";
                detailsUrl = pr.html_url;
                stats = `${pr.changed_files} files changed | +${pr.additions} | -${pr.deletions}`;
                touchedAreas = files.map((file) => `${filePrefix(file.status)} ${file.filename}`);
              } catch (error) {
                core.warning(`Could not enrich PR summary: ${error.message}`);
              }
            }

            if (!touchedAreas.length && after) {
              try {
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: after,
                });
                touchedAreas = (commit.files || []).map((file) => `${filePrefix(file.status)} ${file.filename}`);
              } catch (error) {
                core.warning(`Could not fetch commit files: ${error.message}`);
              }
            }

            if (!prNumber) {
              const commitTitles = (compareCommits.length ? compareCommits : commits)
                .slice(-8)
                .map((commit) => {
                  const message = commit.commit?.message || commit.message || "";
                  return `- ${truncate(message.split("\n")[0], 110)}`;
                });
              const impactAreas = [...new Set((compareFiles || []).map((file) => {
                const filename = file.filename || "";
                if (filename.startsWith("components/")) return "UI components";
                if (filename.startsWith("app/api/")) return "backend/API routes";
                if (filename.startsWith("app/")) return "app routes/pages";
                if (filename.startsWith("data/")) return "domain/mock data";
                if (filename.startsWith("lib/")) return "shared app logic";
                if (filename.startsWith("supabase/")) return "database schema/seed";
                if (filename.startsWith(".github/")) return "automation";
                if (filename.startsWith("docs/")) return "documentation";
                return null;
              }).filter(Boolean))];

              summary = [
                commitTitles.length ? commitTitles.join("\n") : `- ${truncate(headMessage || after, 110)}`,
                impactAreas.length ? `\nAreas: ${impactAreas.join(", ")}` : "",
              ].join("").trim();
            }

            const fileLines = [...new Set(touchedAreas)].slice(0, 12);
            const message = [
              "<b>Grapply production update</b>",
              "",
              `<b>${escapeHtml(title)}</b>`,
              `Repo: ${escapeHtml(`${owner}/${repo}`)}`,
              `Stats: ${escapeHtml(stats)}`,
              "",
              "<b>What changed</b>",
              escapeHtml(truncate(summary, 1200)),
              "",
              "<b>Touched areas</b>",
              escapeHtml(fileLines.length ? fileLines.join("\n") : "- No files listed"),
              "",
              `<a href="${escapeHtml(detailsUrl)}">View changes</a>`,
            ].join("\n").slice(0, 3900);

            core.setOutput("text", message);

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEXT: ${{ steps.summary.outputs.text }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are required."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TELEGRAM_TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
